# Dependabot: gomod ecosystem (stdlib-only policy means this normally finds
# nothing to bump — kept as a canary against accidental require blocks) plus
# GitHub Actions pins (SHA-pinned per CI-2 policy; version comments updated
# only with coordinated CI-Workflows releases).
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"   # SC-3 对齐（治理跟修：monthly→weekly，与其余 active 仓一致）
    open-pull-requests-limit: 5