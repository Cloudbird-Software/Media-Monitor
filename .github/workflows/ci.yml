name: CI
on:
  merge_group:
    # P2-7（ADR-0042）：merge queue 必需订阅
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@61191f87c537f6e887695517121c6e530a838261 # v1

  deps-audit:
    # push 面依赖审计（ADR-0021，红队 #11-C）：dependency-review 只支持 PR 事件（比对
    # base↔head），直推 main 时 deps job 被 skip 而 gate 判绿——push 面零校验。
    # 直推本应只有破玻璃（§8 后验），但"跳过=通过"的 gate 语义是声明性漏洞：
    # push 用 lockfile 审计兜底（npm audit 只读 registry 元数据，无新 action 依赖）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: npm audit（lockfile 高危阻断）
        run: |
          # 只装 npm（runner 预装）；审计 prod+dev 依赖的 high/critical
          npm audit --package-lock-only --audit-level=high

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261
      runtime: node
      node-version: "24"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261

  adr-required:
    # C1 脚手架面（ADR-0021，GOVERNANCE C1 scope）：供应链入口文件变更须引用 ADR。
    # 存在性校验读公开仓 agent-registry/decisions（GITHUB_TOKEN 可读公开仓，fail-closed）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: C1 脚手架变更须引用 ADR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0; C1_HIT=0; PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1 || {
              echo "::error::files API 拉取失败——C1 判定无法保证，fail-closed"; exit 1; }
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(\\.github/|AGENTS\\.md|Makefile|docs/|zizmor\\.yml|\\.dependency-cruiser\\.cjs)"))' <<<"$PAGEJSON" >/dev/null 2>&1; then
              C1_HIT=1
            fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::files API 截断（$GOT/$CHANGED）——fail-closed"; exit 1
          fi
          if [ "$C1_HIT" -ne 1 ]; then
            echo "非 C1 脚手架路径变更，跳过 adr-required"; exit 0
          fi
          ADR_RE='\bADR-[0-9]{4}\b'
          if ! { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "::error::C1 脚手架面（.github/AGENTS.md/Makefile/docs/zizmor.yml）变更但 PR 未引用 ADR-NNNN（GOVERNANCE C1——供应链入口，ADR-0021）"
            exit 1
          fi
          ADR_LISTING=$(gh api "repos/Cloudbird-Software/agent-registry/contents/decisions?per_page=100" --paginate --jq '.[].name' 2>/dev/null)
          if [[ -z "$ADR_LISTING" ]]; then
            echo "::error::agent-registry/decisions 清单拉取失败（fail-closed）"; exit 1
          fi
          MISSING=0
          for ref in $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u ); do
            num="${ref#ADR-}"
            grep -q "^ADR-${num}-" <<<"$ADR_LISTING" || {
              echo "::error::引用的 ${ref} 在 agent-registry/decisions/ 无对应文件（幽灵 ADR）"; MISSING=1; }
          done
          exit $MISSING

  contract:
    # 契约兼容性检测门（P2-4，ADR-0038）：OpenAPI/JSON Schema breaking + DB migration
    # destructive DDL 分类；policy = .github governance/policy/contracts.yaml（org 合入前
    # 用引擎内置 bootstrap 快照）。无事件条件：PR/push 两面都真跑，无 EXPECTED_SKIP 登记。
    # BOOTSTRAP 钉扎：uses 与 ciw-ref 均指向 CI-Workflows PR #18 分支提交（两处一致，
    # 被调用侧无法自取自身 ref）；其 squash 合入并走 v1.X.Y 发布四步流程后，两处同改
    # merge SHA（勿用可变 @main）。
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/contract.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261

  suppression-budget:
    # P2-2 抑制标记预算门（ADR-0036 / .github #87）：净增 ≤3/PR + 合入树总量棘轮
    # + ADR 逃生门。独立 reusable（v1.5.1 内嵌 check.yml 实测触发平台 action 解析
    # 故障，v1.5.3 起独立文件——ADR-0036 修订）。非 PR 事件 n/a-success（无需
    # EXPECTED_SKIP 登记）。
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/suppression-gate.yml@61191f87c537f6e887695517121c6e530a838261
    with:
      detector-ref: 61191f87c537f6e887695517121c6e530a838261

  quality-gates:
    # W2-C2（.github#215，ADR-0061 决策 5 / AC-4）：CI 与本地 make gates-pr 同一编排器
    # 入口 quality/run-gates.sh（同一脚本 + 同一 GATE_* env 注入协议）——本地/CI 结果一致。
    # fetch-depth: 0 是 g050 的硬前提：fail-before 判定要在测试 commit 的 worktree 上
    # 复现红（浅克隆无历史即无拓扑证据，fail-closed）。三事件面都跑，无结构性 skip。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: run-gates pr（统一编排器）
        env:
          GH_TOKEN: ${{ github.token }} # g060 回查 spec PR 状态用（公开仓只读）
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 模板值一律经 env 间接引用（zizmor template-injection 规范）
          if [ -n "$PR_NUMBER" ]; then
            export GATE_PR="$PR_NUMBER" GATE_PR_AUTHOR="$PR_AUTHOR" GATE_BASE="origin/$BASE_REF"
            GATE_CARD=$(printf '%s' "$PR_BODY" | sed -n 's/^Card: [^#]*#\([0-9][0-9]*\).*/\1/p' | head -1)
            [ -n "$GATE_CARD" ] && export GATE_CARD
          fi
          npm ci
          bash quality/run-gates.sh pr

  gate:
    if: always()
    needs:
      [
        hygiene,
        check,
        deps,
        deps-audit,
        adr-required,
        contract,
        suppression-budget,
        quality-gates,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS (event=$EVENT)"
          # 严格断言（P1-3 .github#84 / ADR-0032，standards/automation/required-check-chains.md）：
          # skipped≠success——仅下列 EXPECTED_SKIP 登记的事件互补 job 允许 skipped，
          # 未登记的 skipped 与一切非 success（failure/cancelled/timed_out/startup_failure）一律红
          case "$EVENT" in
            pull_request) EXPECTED_SKIP="deps-audit" ;;
            push)         EXPECTED_SKIP="deps adr-required" ;;
                          # merge_group（ADR-0042）：deps 仅 PR 事件（dependency-review 限制）、deps-audit 仅 push、
                          # adr-required 消费 PR title——三者均已在入队前 PR 面执法，队列面验证组合树本体
            merge_group)  EXPECTED_SKIP="deps deps-audit adr-required" ;;
            *)            EXPECTED_SKIP="" ;;
          esac
          BAD=$(echo "$NEEDS" | jq -r --arg skip "$EXPECTED_SKIP" '
            to_entries[]
            | . as $e
            | select(.value.result != "success")
            | select((($skip | split(" ")) | index($e.key)) == null)
            | "\($e.key)=\($e.value.result)"')
          if [[ -n "$BAD" ]]; then
            echo "::error::以下 job 非 success 且不属于事件 $EVENT 的结构性预期跳过：$BAD（skipped≠success——ADR-0032）"; exit 1
          fi
