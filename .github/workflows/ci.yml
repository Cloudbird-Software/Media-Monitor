name: CI
# Organization-governed gate wiring (aligns with Cloudbird-Software governance
# GOV/BP-2 dual-track: local "gate" aggregation + org-side "org-gate").
# Reusable workflow refs are pinned to CI-Workflows@v1 (SHA b0ce9328: pinned at the CI-Workflows release that registered this repo suppression baseline); the
# same SHA must be passed via ciw-ref inputs (ADR-0043). Do not bump without
# a coordinated CI-Workflows release note.
on:
  merge_group:
    # ADR-0042: merge queue subscription (governance alignment follow-up)
    types: [checks_requested]
  pull_request:
    # edited so that adding/removing an ADR reference in title/body re-runs
    # the adr-required check (same semantics as template-service).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@b0ce93280fd0173f438f3725149117d211eac529 # v1

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@61b6373df06798213be87d295df6fdda23553ddb # v1
    with:
      ciw-ref: b0ce93280fd0173f438f3725149117d211eac529
      runtime: go
      go-version: "1.24"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@b0ce93280fd0173f438f3725149117d211eac529 # v1
    with:
      ciw-ref: b0ce93280fd0173f438f3725149117d211eac529

  deps-audit:
    # Push-side dependency audit (PR-side is the dependency-review action):
    # this repo's dependency policy is stdlib-only, enforced mechanically here.
    # Direct pushes to main should only happen under the guarded break-glass
    # path; the push event still gets the audit (skipped≠success semantics are
    # handled in the gate aggregator below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - name: stdlib-only dependency audit (push side)
        run: |
          set -eu
          if grep -qE '^require ' go.mod; then
            echo "::error::go.mod contains a require block — repo dependency policy is stdlib-only (docs/OPERATIONS.md); new deps need the org approval flow"
            exit 1
          fi
          MODS=$(go list -m all | tail -n +2)
          if [ -n "$MODS" ]; then
            echo "::error::non-empty module graph: $MODS"
            exit 1
          fi
          echo "OK stdlib-only: 0 external modules"

  adr-required:
    # C1-path gate (mirror of org-gate semantics; local check name is for
    # fast feedback only — the org-level org-gate remains the enforcement
    # authority, ADR-0046). C1 paths for this repo:
    # .github/ AGENTS.md Makefile docs/ quality/ CODEOWNERS go.mod governance/
    # Existence of cited ADRs is verified against Cloudbird-Software/archive
    # at adr/ (ADR-0085 single-home index).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: C1 脚手架变更须引用真实 ADR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_API: "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
        run: |
          set -euo pipefail
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0
          C1_HIT=0
          PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            if ! jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1; then
              echo "::error::files API page $PAGE fetch failed — C1 check cannot be guaranteed, fail-closed"
              exit 1
            fi
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(\\.github/|AGENTS\\.md|Makefile|docs/|quality/|CODEOWNERS|go\\.mod|governance/)"))' <<<"$PAGEJSON" >/dev/null 2>&1; then
              C1_HIT=1
            fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::files API truncated ($GOT/$CHANGED) — fail-closed"
            exit 1
          fi
          if [ "$C1_HIT" -ne 1 ]; then
            echo "non-C1 paths only, skipping adr-required"
            exit 0
          fi
          ADR_RE='\bADR-[0-9]{4}\b'
          if ! { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "::error::C1 paths changed but PR title/body cites no ADR-NNNN (GOVERNANCE C1 rule)"
            exit 1
          fi
          ADR_LISTING=$(gh api "repos/Cloudbird-Software/archive/contents/adr?per_page=100" --paginate --jq '.[].name' 2>/dev/null)
          if [ -z "$ADR_LISTING" ]; then
            echo "::error::archive/adr listing fetch failed — fail-closed"
            exit 1
          fi
          MISSING=0
          for ref in $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u ); do
            num="${ref#ADR-}"
            grep -q "^ADR-${num}-" <<<"$ADR_LISTING" || {
              echo "::error::referenced ${ref} has no matching file under archive/adr/ (ghost ADR)"
              MISSING=1
            }
          done
          exit $MISSING

  contract:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/contract.yml@b0ce93280fd0173f438f3725149117d211eac529 # v1
    with:
      ciw-ref: b0ce93280fd0173f438f3725149117d211eac529

  suppression-budget:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/suppression-gate.yml@61b6373df06798213be87d295df6fdda23553ddb
    with:
      detector-ref: b0ce93280fd0173f438f3725149117d211eac529

  quality-gates:
    # Same orchestrator as local `make gates-pr`: quality/run-gates.sh with
    # GATE_* env protocol (template-service pattern, ADR-0061).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - name: run-gates pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          export GATE_PR="$PR_NUMBER" GATE_PR_AUTHOR="$PR_AUTHOR" GATE_BASE="origin/$BASE_REF"
          GATE_CARD=$(printf '%s' "$PR_BODY" | sed -n 's/^Card: [^#]*#\([0-9][0-9]*\).*/\1/p' | head -1)
          if [ -n "$GATE_CARD" ]; then export GATE_CARD; fi
          bash quality/run-gates.sh pr

  gate:
    # Strict aggregator (ADR-0032: skipped≠success) with per-event structural
    # skip allow-list (template-service pattern).
    if: always()
    needs: [hygiene, check, deps, deps-audit, adr-required, contract, suppression-budget, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS (event=$EVENT)"
          case "$EVENT" in
            pull_request) EXPECTED_SKIP="deps-audit" ;;
            push)         EXPECTED_SKIP="deps adr-required" ;;
            merge_group)  EXPECTED_SKIP="deps deps-audit adr-required" ;;   # ADR-0042: PR-only/push-only jobs structurally skipped
            *)            EXPECTED_SKIP="" ;;
          esac
          BAD=$(echo "$NEEDS" | jq -r --arg skip "$EXPECTED_SKIP" '
            to_entries[]
            | . as $e
            | select(.value.result != "success")
            | select((($skip | split(" ")) | index($e.key)) == null)
            | "\($e.key)=\($e.value.result)"')
          if [[ -n "$BAD" ]]; then
            echo "::error::jobs not success and not structurally skipped for event $EVENT: $BAD (ADR-0032 skipped≠success)"
            exit 1
          fi
          echo "gate PASS ($EVENT)"