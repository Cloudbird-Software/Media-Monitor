name: CodeQL
# Self-managed CodeQL analysis (Go) so every commit — not just PR sync
# events — gets a fresh analysis; results feed the org codeql-gate ruleset
# (SC-1). github-owned actions only (CI-2 whitelist).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 3"

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
